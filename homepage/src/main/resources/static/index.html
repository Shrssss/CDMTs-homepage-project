<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage API Business Logic Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;line-height:1.5;background:#f7f7f7;color:#222}
h1{margin-bottom:5px}.desc{color:#666}
section{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0}
h2{margin-top:0}
label{display:block;margin:8px 0 3px;font-weight:bold}
input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:6px}
button{padding:9px 14px;margin:7px 5px 0 0;border:0;border-radius:6px;cursor:pointer}
.primary{background:#222;color:white}.secondary{background:#ddd}
.result{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:6px;margin-top:10px;min-height:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.small{font-size:.9em;color:#666}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Homepage API 業務ロジックテスト</h1>
<p class="desc">Spring Boot APIを「登録 → ログイン → 業務操作」の流れで確認するためのテストHTMLです。</p>

<section>
<h2>1. 接続設定</h2>
<label>API Base URL</label>
<input id="baseUrl" value="http://localhost:8080">
<p class="small">本番・検証環境を使う場合はURLを変更してください。</p>
</section>

<section>
<h2>2. メンバー登録 → ログイン</h2>
<div class="grid">
<div>
<label>名前 *</label><input id="regName" value="API Test User">
<label>Student ID *</label><input id="regStudentId" value="99A0001" maxlength="7">
<label>Email *</label><input id="regEmail" value="api-test@example.com">
<label>Grade *</label><input id="regGrade" type="number" min="1" max="4" value="1">
<label>Password *</label><input id="regPassword" type="password" value="password1234">
</div>
<div>
<p class="small">登録DTOの必須項目に合わせています。</p>
<button class="primary" onclick="register()">メンバー登録</button>
<button class="secondary" onclick="login()">ログイン</button>
<button class="secondary" onclick="logout()">ログアウト</button>
</div>
</div>
<div id="authResult" class="result"></div>
</section>

<section>
<h2>3. Technology 登録 → 詳細 → メンバー</h2>
<div class="grid">
<div>
<label>Technology name *</label><input id="techName" value="Java">
<label>Description *</label><textarea id="techDescription">Java programming language</textarea>
</div>
<div>
<p class="small">TechnologyCreateRequest の @NotBlank 対応。</p>
<button class="primary" onclick="createTechnology()">Technology登録</button>
<label>Technology ID</label><input id="techId" placeholder="登録後に自動入力">
<button class="secondary" onclick="getTechnology()">Technology詳細</button>
<button class="secondary" onclick="getTechnologyMembers()">Technology所属メンバー</button>
</div>
</div>
<div id="techResult" class="result"></div>
</section>

<section>
<h2>4. Item 業務フロー</h2>
<div class="grid">
<div>
<label>Item ID</label><input id="itemId" placeholder="例: 1">
<label>Quantity</label><input id="quantity" type="number" min="1" value="1">
</div>
<div>
<button class="primary" onclick="rentItem()">貸出</button>
<button class="secondary" onclick="getItem()">Item確認</button>
<button class="secondary" onclick="returnItem()">返却</button>
<button class="secondary" onclick="getRentalHistory()">貸出履歴</button>
</div>
</div>
<div id="itemResult" class="result"></div>
</section>

<section>
<h2>5. Member API</h2>
<div class="grid">
<div>
<label>Member ID</label><input id="memberId">
<label>検索名</label><input id="memberName">
</div>
<div>
<button class="secondary" onclick="getMember()">Member取得</button>
<button class="secondary" onclick="searchMembers()">Member検索</button>
<button class="secondary" onclick="updateMember()">Member更新</button>
<button class="secondary" onclick="deleteMember()">Member削除</button>
</div>
</div>
<div id="memberResult" class="result"></div>
</section>

<section>
<h2>6. News API</h2>
<div class="grid">
<div>
<label>Title</label><input id="newsTitle" value="API Test News">
<label>Content</label><textarea id="newsContent">API test content</textarea>
</div>
<div>
<label>News ID</label><input id="newsId">
<button class="primary" onclick="createNews()">News登録</button>
<button class="secondary" onclick="getNews()">News取得</button>
<button class="secondary" onclick="updateNews()">News更新</button>
<button class="secondary" onclick="deleteNews()">News削除</button>
</div>
</div>
<div id="newsResult" class="result"></div>
</section>

<section>
<h2>7. 個別APIテスト</h2>
<label>HTTP Method</label>
<select id="method">
<option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
</select>
<label>Path</label>
<input id="path" value="/api/">
<label>JSON Body</label>
<textarea id="body">{}</textarea>
<button class="primary" onclick="manualApi()">実行</button>
<div id="manualResult" class="result"></div>
</section>

<script>
let currentMemberId = null;
let currentTechnologyId = null;

function base(){ return document.getElementById('baseUrl').value.replace(/\/+$/,''); }
function val(id){ return document.getElementById(id).value; }
function show(id, data){ document.getElementById(id).textContent = typeof data === 'string' ? data : JSON.stringify(data,null,2); }

async function call(resultId, method, path, body=null){
  const opt={method,credentials:'include',headers:{'Content-Type':'application/json'}};
  if(body!==null && method!=='GET') opt.body=JSON.stringify(body);
  try{
    const r=await fetch(base()+path,opt);
    const text=await r.text();
    let data; try{data=JSON.parse(text)}catch{data=text}
    show(resultId, 'HTTP '+r.status+'\\n'+JSON.stringify(data,null,2));
    return {status:r.status,data};
  }catch(e){
    show(resultId,'通信エラー\\n'+e);
    return {status:0,data:null};
  }
}

async function register(){
  if(!val('regName')||!val('regStudentId')||!val('regEmail')||!val('regGrade')||!val('regPassword')){
    return alert('必須項目を入力してください');
  }
  if(val('regStudentId').length!==7) return alert('Student IDは7文字です');
  const r=await call('authResult','POST','/api/auth',{
    name:val('regName'),
    studentId:val('regStudentId'),
    email:val('regEmail'),
    grade:Number(val('regGrade')),
    password:val('regPassword')
  });
  if(r.status>=200 && r.status<300 && r.data){
    currentMemberId=r.data.id ?? r.data.memberId ?? r.data;
    document.getElementById('memberId').value=currentMemberId ?? '';
  }
}

async function login(){
  const identifier=val('regEmail')||val('regStudentId');
  await call('authResult','POST','/api/auth/login',{
    identifier:identifier,
    password:val('regPassword')
  });
}
async function logout(){ await call('authResult','POST','/api/auth/logout'); }

async function createTechnology(){
  if(!val('techName')||!val('techDescription')) return alert('Technology name と Description は必須です');
  const r=await call('techResult','POST','/api/technologies',{
    name:val('techName'),
    description:val('techDescription')
  });
  if(r.status>=200 && r.status<300 && r.data){
    currentTechnologyId=r.data.id ?? r.data.technologyId ?? r.data;
    document.getElementById('techId').value=currentTechnologyId ?? '';
  }
}
async function getTechnology(){
  const id=val('techId');
  if(!id) return alert('Technology IDを入力してください');
  await call('techResult','GET','/api/technologies/'+encodeURIComponent(id));
}
async function getTechnologyMembers(){
  const id=val('techId');
  if(!id) return alert('Technology IDを入力してください');
  await call('techResult','GET','/api/technologies/'+encodeURIComponent(id)+'/members');
}

async function getItem(){
  const id=val('itemId'); if(!id)return alert('Item IDを入力してください');
  await call('itemResult','GET','/api/items/'+encodeURIComponent(id));
}
async function rentItem(){
  const id=val('itemId'); if(!id)return alert('Item IDを入力してください');
  await call('itemResult','POST','/api/items/'+encodeURIComponent(id)+'/rent',{quantity:Number(val('quantity'))});
}
async function returnItem(){
  const id=val('itemId'); if(!id)return alert('Item IDを入力してください');
  await call('itemResult','POST','/api/items/'+encodeURIComponent(id)+'/return');
}
async function getRentalHistory(){
  await call('itemResult','GET','/api/items/rental-history');
}

async function getMember(){
  const id=val('memberId'); if(!id)return alert('Member IDを入力してください');
  await call('memberResult','GET','/api/members/'+encodeURIComponent(id));
}
async function searchMembers(){
  const name=encodeURIComponent(val('memberName')||'');
  await call('memberResult','GET','/api/members/search?name='+name);
}
async function updateMember(){
  const id=val('memberId'); if(!id)return alert('Member IDを入力してください');
  await call('memberResult','PUT','/api/members/'+encodeURIComponent(id),{
    name:val('regName'),
    email:val('regEmail'),
    grade:Number(val('regGrade'))
  });
}
async function deleteMember(){
  const id=val('memberId'); if(!id)return alert('Member IDを入力してください');
  await call('memberResult','DELETE','/api/members/'+encodeURIComponent(id));
}

async function createNews(){
  await call('newsResult','POST','/api/news',{
    title:val('newsTitle'),
    content:val('newsContent')
  });
}
async function getNews(){
  const id=val('newsId');
  await call('newsResult','GET',id?'/api/news/'+encodeURIComponent(id):'/api/news');
}
async function updateNews(){
  const id=val('newsId'); if(!id)return alert('News IDを入力してください');
  await call('newsResult','PUT','/api/news/'+encodeURIComponent(id),{
    title:val('newsTitle'),
    content:val('newsContent')
  });
}
async function deleteNews(){
  const id=val('newsId'); if(!id)return alert('News IDを入力してください');
  await call('newsResult','DELETE','/api/news/'+encodeURIComponent(id));
}

async function manualApi(){
  let body=null;
  if(!['GET','DELETE'].includes(val('method'))){
    try{body=JSON.parse(val('body'))}catch(e){return alert('JSON Bodyが不正です')}
  }
  await call('manualResult',val('method'),val('path'),body);
}
</script>
</body>
</html>
