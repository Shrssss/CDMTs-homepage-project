spring:
   application:
      name: homepage
      
   servlet:
      multipart:
         max-file-size: 5MB
         max-request-size: 6MB
   
   datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/homepage}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
      
cors:
   allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  
file:
   upload-dir: ${UPLOAD_DIR:./uploads}
   
server:
   servlet:
      session:
         cookie:
            http-only: true
            same-site: lax
            secure: ${SESSION_COOKIE_SECURE:false}

csrf:
   cookie-secure: ${CSRF_COOKIE_SECURE:false}
   cookie-domain: ${CSRF_COOKIE_DOMAIN:}
   
logging:
   level:
      root: INFO
      net.codemates.homepage: ${LOG_LEVEL:INFO}
      # net.codemates.homepage.mapper: DEBUG   #調査時有効
      # org.springframeword.security: DEBUG
   file:
      name: ${LOG_FILE:./logs/homepage.log}
   logback:
      rollingpolicy:
         max-file-size: 10MB
         max-history: 30
         total-size-cap: 1GB
      